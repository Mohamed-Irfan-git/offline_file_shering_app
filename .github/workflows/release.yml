name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact_name: lan-share-linux-x86_64
            bin_name: lan-share
            archive_ext: tar.gz
            archive_cmd: tar
          - runner: windows-latest
            artifact_name: lan-share-windows-x86_64
            bin_name: lan-share.exe
            archive_ext: zip
            archive_cmd: zip
          - runner: macos-latest
            artifact_name: lan-share-macos-aarch64
            bin_name: lan-share
            archive_ext: tar.gz
            archive_cmd: tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Assemble portable package
        shell: bash
        run: |
          PKG="lan-share-${{ matrix.artifact_name }}"
          mkdir -p "$PKG/static" "$PKG/uploads"
          cp "target/release/${{ matrix.bin_name }}" "$PKG/"
          cp -r static/* "$PKG/static/"
          touch "$PKG/uploads/.gitkeep"

          cat > "$PKG/README.txt" <<'EOF'
LAN Share — portable build
==========================

1. Connect to Wi-Fi.
2. Run the lan-share binary from this folder (keep static/ beside it).
3. On this PC: http://localhost:5000
4. On phones: use http://192.168.x.x:5000 from the terminal (NOT localhost).

Allow firewall access for port 5000 if prompted.
EOF

          if [[ "${{ matrix.archive_cmd }}" == "tar" ]]; then
            chmod +x "$PKG/${{ matrix.bin_name }}"
            cat > "$PKG/run.sh" <<'EOF'
#!/usr/bin/env bash
cd "$(dirname "$0")"
./lan-share
EOF
            chmod +x "$PKG/run.sh"
            tar -czf "${PKG}.${{ matrix.archive_ext }}" "$PKG"
          else
            cat > "$PKG/run.bat" <<'EOF'
@echo off
cd /d "%~dp0"
lan-share.exe
pause
EOF
            # GitHub Windows runners include zip via PowerShell
            powershell -Command "Compress-Archive -Path '$PKG' -DestinationPath '${PKG}.${{ matrix.archive_ext }}' -Force"
          fi

          ls -la "${PKG}.${{ matrix.archive_ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: lan-share-${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
