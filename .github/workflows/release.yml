name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact_name: lan-share-linux-x86_64
            bin_name: lan-share
            archive_ext: tar.gz

          - runner: windows-latest
            artifact_name: lan-share-windows-x86_64
            bin_name: lan-share.exe
            archive_ext: zip

          - runner: macos-latest
            artifact_name: lan-share-macos
            bin_name: lan-share
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Assemble portable package
        shell: bash
        run: |
          PKG="${{ matrix.artifact_name }}"
          mkdir -p "$PKG/static" "$PKG/uploads"

          cp "target/release/${{ matrix.bin_name }}" "$PKG/"
          cp -r static/* "$PKG/static/"
          touch "$PKG/uploads/.gitkeep"

          cat > "$PKG/README.txt" <<'EOF'
          LAN Share Portable Build

          1. Connect all devices to the same Wi-Fi/LAN.
          2. Run the app from this folder.
          3. On this computer: http://localhost:5000
          4. On phones: use the LAN URL shown in terminal or scan QR code.
          5. Do not use localhost on phone.

          Allow firewall access for port 5000 if prompted.
          EOF

          if [[ "${{ matrix.archive_ext }}" == "tar.gz" ]]; then
            chmod +x "$PKG/${{ matrix.bin_name }}"

            cat > "$PKG/run.sh" <<'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          ./lan-share
          EOF

            chmod +x "$PKG/run.sh"
            tar -czf "${PKG}.tar.gz" "$PKG"
          else
            cat > "$PKG/run.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          lan-share.exe
          pause
          EOF

            powershell -Command "Compress-Archive -Path '$PKG' -DestinationPath '${PKG}.zip' -Force"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip